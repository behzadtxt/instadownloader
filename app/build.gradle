plugins { id 'com.android.application' }

android {
    namespace 'com.example.instadownloader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.instadownloader'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk true
        }
    }
}

dependencies {
    implementation 'dev.ffmpegkit-maintained:yt-dlp-android:2.0.2'
    implementation 'dev.ffmpegkit-maintained:yt-dlp-android-compat:2.0.2'
    
}
